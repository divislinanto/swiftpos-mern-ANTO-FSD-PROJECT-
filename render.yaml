services:
  - type: web
    name: swiftpos-mern
    env: node
    plan: free
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set this to your MongoDB Atlas connection string in Render Dashboard
