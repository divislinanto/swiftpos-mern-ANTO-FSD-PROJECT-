version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:latest
    container_name: swiftpos-mongo
    restart: always
    ports:
      - "27017:27017" # Accessible to MongoDB Compass!
    volumes:
      - mongo-data:/data/db
    networks:
      - pos-network

  # SwiftPOS Application Service (Single Localhost Link on 5000)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swiftpos-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/pos_db
    depends_on:
      - mongo
    networks:
      - pos-network

volumes:
  mongo-data:

networks:
  pos-network:
    driver: bridge
